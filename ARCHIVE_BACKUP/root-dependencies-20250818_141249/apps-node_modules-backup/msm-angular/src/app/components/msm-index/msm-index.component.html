<div class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 text-white p-8"> <div class="container mx-auto"> <!-- Header --> <div class="text-center mb-8"> <h1 class="text-4xl font-bold mb-4">Million Song Mind</h1> <p class="text-xl text-gray-300">Harmonic Profile Analyzer</p> </div> <!-- Harmonic Chart Section --> <div class="bg-gray-800 rounded-lg p-6 mb-8"> <div class="text-center mb-4"> <h2 class="text-2xl font-bold">Harmonic Profile</h2> <p class="text-gray-400">Chord distribution analysis</p> </div> <div class="grid grid-cols-1 md:grid-cols-3 gap-4"> <div class="bg-green-900/20 rounded-lg p-4 border border-green-500/30"> <h3 class="font-bold text-green-400 mb-2">Major</h3> <div class="space-y-1"> <div *ngFor="let item of currentData | slice:0:7" class="flex justify-between text-sm"> <span>{{ item.chord }}</span> <span class="text-green-400">{{ item.percent }}%</span> </div> </div> </div> </div> </div> <!-- Search Section --> <div class="bg-gray-800 rounded-lg p-6 mb-8"> <h2 class="text-2xl font-bold mb-4">Search Songs</h2> <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"> <input type="text" [(ngModel)]="searchFilters.songName" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white" placeholder="Search songs..."> <input type="text" [(ngModel)]="searchFilters.artistName" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white" placeholder="Search artists..."> <select [(ngModel)]="searchFilters.genre" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white"> <option value="">All Genres</option> <option value="pop">Pop</option> <option value="rock">Rock</option> <option value="jazz">Jazz</option> </select> <select [(ngModel)]="searchFilters.decade" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white"> <option value="">All Decades</option> <option value="1960s">1960s</option> <option value="1970s">1970s</option> <option value="1980s">1980s</option> <option value="1990s">1990s</option> <option value="2000s">2000s</option> <option value="2010s">2010s</option> <option value="2020s">2020s</option> </select> </div> </div> <!-- Sample Songs Section --> <div class="bg-gray-800 rounded-lg p-6"> <h2 class="text-2xl font-bold mb-4">Sample Songs</h2> <div class="space-y-4"> <div *ngFor="let song of sampleSongs" class="bg-gray-700 rounded-lg p-4"> <h3 class="font-bold text-lg">{{ song.songName }}</h3> <p class="text-gray-400">{{ song.artistName }}</p> <p class="text-sm text-gray-500">{{ song.releaseDate }} • {{ song.mainGenre }}</p> <div class="mt-2"> <span *ngFor="let chord of song.chords" class="inline-block bg-blue-600 text-white px-2 py-1 rounded text-sm mr-2 mb-1">{{ chord }}</span> </div> </div> </div> </div> </div> </div>
