name: PR Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  pr-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (CI)
        run: npm run build --if-present

      - name: Sentinel checks
        run: |
          grep -R "SENTINEL_LOVABLE_BRAID_FREEZE" -n . >/dev/null
          grep -R "SENTINEL_COPILOT_BACKEND_FREEZE" -n . >/dev/null

      - name: Enforce cross-review labels for changed areas
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100
            });
            const labels = (pr.labels || []).map(l => l.name);
            const changedLovable = files.some(f => (/^src\/components\/braid\//.test(f.filename) || /^src\/pages\/Braid.*\.tsx$/.test(f.filename)));
            const changedCopilot = files.some(f => (
              /^src\/utils\/cpmlParser\.ts$/.test(f.filename) ||
              /^src\/lib\/utils\.ts$/.test(f.filename) ||
              /^scripts\//.test(f.filename) ||
              /^tools\//.test(f.filename)
            ));
            if (changedLovable && !labels.includes('lovable-approved')) {
              core.setFailed('Missing "lovable-approved" label for braid/pages changes.');
            }
            if (changedCopilot && !labels.includes('copilot-approved')) {
              core.setFailed('Missing "copilot-approved" label for backend/data changes.');
            }
