<!DOCTYPE html>
<html>
<head>
    <title>Ninja Console Capture</title>
    <script>
        // Load the console monitor
        fetch('/NINJA_CONSOLE_MONITOR.js')
            .then(response => response.text())
            .then(script => {
                eval(script);
                
                // Wait a moment then load the actual app
                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);
            });
    </script>
</head>
<body>
    <h1>Loading Ninja Console Monitor...</h1>
</body>
</html>
