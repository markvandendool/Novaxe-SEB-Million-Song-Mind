<!DOCTYPE html>
<html>

<head>
    <style>
        @font-face {
            font-family: 'music-font';
            src: url("/fonts/Chord_Grid_v2.otf") format("opentype");
        }

        @font-face {
            font-family: 'test-jan16';
            src: url("/fonts/nvxFont.otf") format("opentype");
        }

        body {
            font-size: 48px;
            padding: 20px;
            background: white;
        }

        .test {
            margin: 20px;
            border: 2px solid black;
            padding: 10px;
        }

        .music-font {
            font-family: 'music-font';
        }

        .jan16-font {
            font-family: 'test-jan16';
        }

        .raw {
            font-family: monospace;
            color: red;
        }
    </style>
</head>

<body>
    <h1>Font Test Page</h1>

    <div class="test">
        <div class="raw">Raw Input: Bb Eb Ab Db Gb</div>
        <div class="music-font">music-font: Bb Eb Ab Db Gb</div>
    </div>

    <div class="test">
        <div class="raw">Transformed: Bl El Al Dl Gl</div>
        <div class="music-font">music-font: Bl El Al Dl Gl</div>
    </div>

    <div class="test">
        <div class="raw">Jan16 Font: Bl El Al Dl Gl</div>
        <div class="jan16-font">jan16-font: Bl El Al Dl Gl</div>
    </div>

    <div class="test">
        <div class="raw">Minor chords: Bm Em Am Dm Gm</div>
        <div class="music-font">music-font: Bm Em Am Dm Gm</div>
    </div>
</body>

</html>
