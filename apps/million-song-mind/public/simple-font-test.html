<!DOCTYPE html>
<html>

<head>
    <style>
        @font-face {
            font-family: 'music-font';
            src: url("/fonts/Chord_Grid_v2.otf") format("opentype");
        }

        body {
            padding: 50px;
            background: white;
            font-family: Arial, sans-serif;
        }

        .big {
            font-size: 72px;
            margin: 20px 0;
            padding: 20px;
            border: 2px solid black;
        }

        .music {
            font-family: 'music-font';
        }

        .mono {
            font-family: monospace;
        }
    </style>
</head>

<body>
    <h1>Simple Font Test</h1>

    <div class="big mono">
        Monospace: Bb Eb Ab Db Gb
    </div>

    <div class="big music">
        Music Font: Bb Eb Ab Db Gb
    </div>

    <div class="big mono">
        Monospace: Bl El Al Dl Gl
    </div>

    <div class="big music">
        Music Font: Bl El Al Dl Gl
    </div>

    <div class="big music">
        Music Font: C D E F G A B
    </div>

    <p>If the music font is working, one of the above should show flat symbols (♭)</p>

    <script>
        document.fonts.ready.then(() => {
            document.fonts.load('72px music-font').then((fonts) => {
                console.log('Font load result:', fonts);
                if (fonts.length === 0) {
                    alert('music-font did not load!');
                } else {
                    console.log('music-font loaded successfully');
                }
            });
        });
    </script>
</body>

</html>
