<!DOCTYPE html>
<html>

<head>
    <style>
        @font-face {
            font-family: 'music-font';
            src: url("/fonts/test-jan16.otf") format("opentype");
        }

        @font-face {
            font-family: 'nvxChord';
            src: url("/fonts/test-jan16.otf") format("opentype");
        }

        body {
            padding: 30px;
            background: #333;
            color: white;
        }

        svg {
            background: white;
            border: 3px solid green;
            margin: 20px;
        }

        .test-text {
            font-family: 'music-font' !important;
            font-size: 24px;
            fill: black;
        }

        #braid-tonal svg text {
            font-family: 'music-font' !important;
        }

        .chord-font {
            font-family: 'music-font' !important;
        }
    </style>
</head>

<body>
    <h1>Braid Font Test - Simulating the Exact Braid Structure</h1>

    <section id="braid-tonal">
        <svg width="400" height="300" viewBox="0 0 400 300">
            <!-- Simulating braid text elements -->
            <text class="test-text chord-font" x="50" y="50">Bl</text>
            <text class="test-text chord-font" x="150" y="50">El</text>
            <text class="test-text chord-font" x="250" y="50">Al</text>

            <text class="test-text duo braid-label" x="50" y="100">Dl</text>
            <text class="test-text duo braid-label" x="150" y="100">Gl</text>
            <text class="test-text duo braid-label" x="250" y="100">Cl</text>

            <text class="test-text" x="50" y="150">Fl</text>
            <text class="test-text" x="150" y="150">Bm</text>
            <text class="test-text" x="250" y="150">Em</text>

            <text x="50" y="200" style="font-family: 'music-font' !important; font-size: 24px; fill: black;">Direct:
                Bl</text>
            <text x="150" y="200" style="font-family: 'nvxChord' !important; font-size: 24px; fill: black;">nvxChord:
                El</text>
        </svg>
    </section>

    <p style="font-size: 24px;">
        ✅ If you see flat symbols (♭) above, the font is working!<br>
        ❌ If you see "Bl", "El", "Al" as letters, the font is NOT being applied.
    </p>

    <script>
        document.fonts.ready.then(() => {
            document.fonts.load('24px music-font').then((fonts) => {
                console.log('music-font loaded:', fonts.length > 0);
            });
            document.fonts.load('24px nvxChord').then((fonts) => {
                console.log('nvxChord loaded:', fonts.length > 0);
            });
        });
    </script>
</body>

</html>
