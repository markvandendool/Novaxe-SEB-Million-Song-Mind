<!DOCTYPE html>
<html>

<head>
    <title>Magic 18 - Step 1: Two SVG Spread</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .spread {
            display: flex;
            gap: 20px;
            max-width: 100%;
            justify-content: center;
        }

        .page {
            flex: 1;
            max-width: 45%;
            border: 2px solid #333;
            background: white;
            padding: 10px;
            border-radius: 10px;
        }

        .page h2 {
            text-align: center;
            margin: 0 0 10px 0;
            padding: 10px;
            background: #333;
            color: white;
            border-radius: 5px;
        }

        .left h2 {
            background: #2196F3;
        }

        .right h2 {
            background: #FF5722;
        }

        img {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid #ddd;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>🎸 Magic 18 - Step 1: Two Page Spread</h1>
        <p>Loading your actual SVG files...</p>
    </div>

    <div class="spread">
        <div class="page left">
            <h2>Left Page - C Major</h2>
            <img src="/Users/markvandendool/Novaxe-SEB-Million-Song-Mind/Charts Magic18 SVG_C Left.svg"
                alt="Magic 18 C Left">
        </div>

        <div class="page right">
            <h2>Right Page - C Minor</h2>
            <img src="/Users/markvandendool/Novaxe-SEB-Million-Song-Mind/Charts Magic18 SVG_C Right.svg"
                alt="Magic 18 C Right">
        </div>
    </div>
</body>

</html>
