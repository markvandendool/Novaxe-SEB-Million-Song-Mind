<div class="midi-chord-container">
    <h3>🎵 MIDI Chord Detection</h3>
    <p><strong>Migration Status:</strong> ✅ Successfully migrated to Angular 20!</p>
    <p><strong>Original Size:</strong> 30 lines</p>

    <div class="detection-display">
        <div class="chord-name">{{ detectedChord }}</div>
        <div class="midi-notes" *ngIf="midiNotes.length > 0">
            MIDI Notes: {{ midiNotes.join(', ') }}
        </div>
        <button (click)="simulateChordDetection()" class="detect-btn">
            🎹 Simulate Chord Detection
        </button>
    </div>

    <div class="status-indicator">
        <span class="success">🟢 MIDI Component Active</span>
    </div>
</div>
