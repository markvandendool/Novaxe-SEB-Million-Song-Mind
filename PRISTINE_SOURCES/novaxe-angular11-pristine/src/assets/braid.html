<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Novaxe Braid</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        .braid-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        .braid-controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            color: white;
        }
        .control-group {
            margin-bottom: 10px;
        }
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            text-transform: uppercase;
        }
        .control-select {
            padding: 5px;
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            border-radius: 4px;
        }
        .control-button {
            padding: 5px 10px;
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
        }
        .control-button.active {
            background: #00a450;
            border-color: #00a450;
        }
        .braid-svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="braid-container">
        <div class="braid-controls">
            <div class="control-group">
                <label>Braid Type:</label>
                <select id="braidType" class="control-select">
                    <option value="tonal">Tonal</option>
                    <option value="blues">Blues</option>
                </select>
            </div>
            <div class="control-group">
                <label>Tonality:</label>
                <select id="tonality" class="control-select">
                    <option value="C">C</option>
                    <option value="G">G</option>
                    <option value="D">D</option>
                    <option value="A">A</option>
                    <option value="E">E</option>
                    <option value="B">B</option>
                    <option value="F#">F#</option>
                    <option value="C#">C#</option>
                    <option value="G#">G#</option>
                    <option value="D#">D#</option>
                    <option value="A#">A#</option>
                    <option value="F">F</option>
                </select>
            </div>
            <div class="control-group">
                <label>Display Mode:</label>
                <select id="displayMode" class="control-select">
                    <option value="2">Single Tonality</option>
                    <option value="1">Dual Tonality</option>
                    <option value="3">Extended Tonality</option>
                    <option value="4">Full Range</option>
                </select>
            </div>
            <div class="control-group">
                <button id="romanToggle" class="control-button">Show Roman</button>
            </div>
            <div class="control-group">
                <button id="scoreFollowToggle" class="control-button active">Score Follow ON</button>
            </div>
        </div>
        
        <!-- Real Novaxe Braid SVG - This is the actual braid from the Novaxe component -->
        <svg id="braid-tonal-svg" class="braid-svg" version="1.1" viewBox="-10 40 320 1600" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="greenGradient" x1="0.5" x2="0.8" y1="0.1" y2="0.8">
                    <stop offset="0%" stop-color="#00a450"/>
                    <stop offset="100%" stop-color="#416c63"/>
                </linearGradient>
                <radialGradient id="greyGradient" x1="0.1" y1="0.1" x2="1" y2="1">
                    <stop offset="0%" stop-color="#7f8899"/>
                    <stop offset="100%" stop-color="#58595b"/>
                </radialGradient>
                <filter id="f1">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="3" />
                </filter>
                <filter id="f2">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="imgBlur" />
                    <feSpecularLighting in="imgBlur" surfaceScale="2" specularConstant=".75" specularExponent="20" lighting-color="#bbbbbb" result="imgSpecular">
                        <fePointLight x="-5" y="-100" z="100" />
                    </feSpecularLighting>
                    <feComposite in="imgSpecular" in2="SourceAlpha" operator="in" result="imgMasked" />
                    <feComposite in="SourceGraphic" in2="imgMasked" operator="arithmetic" k1="0" k2="1" k3="2" k4="0"/>
                </filter>
                <g id="circle" style="transform: translate(-150px, -160px);">
                    <path cx="150.45" cy="161.55" r="84.076797" d="M 234.52679,161.55 A 84.076797,84.076797 0 0 1 150.45,245.6268 84.076797,84.076797 0 0 1 66.373199,161.55 84.076797,84.076797 0 0 1 150.45,77.473206 84.076797,84.076797 0 0 1 234.52679,161.55 Z"/>
                </g>
                <g id="rectV">
                    <path d="m-17-26s19.6 25.5 0 52c.631-.631 18.1-8.98 33.1-.312-.315 0-19.6-25.8 0-51.4 0-.315-16.6 9.22-33.1-.312z"/>
                </g>
                <g id="arrow">
                    <path d="m5.46-8.1-5.75 7.18-5.78-7.19v7.14l5.77 9.14 5.72-8.97z"/>
                </g>
            </defs>
            
            <g transform="translate(150 0) scale(0.9)">
                <!-- Center Major -->
                <use class="greenCircle active" xlink:href="#circle" transform="translate(0 90)"/>
                <text x="150" y="205" text-anchor="middle" fill="white" font-size="14" font-weight="bold">C</text>
                
                <!-- Left Major -->
                <use class="greenCircle" xlink:href="#circle" transform="translate(-50 90)"/>
                <text x="100" y="205" text-anchor="middle" fill="white" font-size="12">F</text>
                
                <!-- Right Major -->
                <use class="greenCircle" xlink:href="#circle" transform="translate(50 90)"/>
                <text x="200" y="205" text-anchor="middle" fill="white" font-size="12">G</text>
                
                <!-- Center Minor -->
                <use class="greenCircle active" xlink:href="#circle" transform="translate(0 180)"/>
                <text x="150" y="295" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Am</text>
                
                <!-- Left Minor -->
                <use class="greenCircle" xlink:href="#circle" transform="translate(-50 180)"/>
                <text x="100" y="295" text-anchor="middle" fill="white" font-size="12">Dm</text>
                
                <!-- Right Minor -->
                <use class="greenCircle" xlink:href="#circle" transform="translate(50 180)"/>
                <text x="200" y="295" text-anchor="middle" fill="white" font-size="12">Em</text>
                
                <!-- Links -->
                <use class="rect-arrow" xlink:href="#rectV" transform="translate(0 135)"/>
                <use class="arrows-2" xlink:href="#arrow" transform="translate(0 135)"/>
                
                <!-- Additional braid elements -->
                <use class="greenCircle" xlink:href="#circle" transform="translate(0 270)"/>
                <text x="150" y="385" text-anchor="middle" fill="white" font-size="12">F</text>
                
                <use class="greenCircle" xlink:href="#circle" transform="translate(0 360)"/>
                <text x="150" y="475" text-anchor="middle" fill="white" font-size="12">G</text>
                
                <use class="greenCircle" xlink:href="#circle" transform="translate(0 450)"/>
                <text x="150" y="565" text-anchor="middle" fill="white" font-size="12">C</text>
            </g>
        </svg>
    </div>

    <script>
        // Simple controls for the braid
        document.getElementById('braidType').addEventListener('change', function() {
            console.log('Braid type changed to:', this.value);
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    source: 'novaxe-braid',
                    data: { type: 'braidTypeChange', braidType: this.value }
                }, '*');
            }
        });

        document.getElementById('tonality').addEventListener('change', function() {
            console.log('Tonality changed to:', this.value);
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    source: 'novaxe-braid',
                    data: { type: 'tonalityChange', tonality: this.value }
                }, '*');
            }
        });

        document.getElementById('romanToggle').addEventListener('click', function() {
            this.classList.toggle('active');
            const isRoman = this.classList.contains('active');
            this.textContent = isRoman ? 'Show Notes' : 'Show Roman';
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    source: 'novaxe-braid',
                    data: { type: 'romanToggle', displayRoman: isRoman }
                }, '*');
            }
        });

        document.getElementById('scoreFollowToggle').addEventListener('click', function() {
            this.classList.toggle('active');
            const isActive = this.classList.contains('active');
            this.textContent = isActive ? 'Score Follow ON' : 'Score Follow OFF';
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    source: 'novaxe-braid',
                    data: { type: 'scoreFollowToggle', scoreFollow: isActive }
                }, '*');
            }
        });

        // Listen for messages from parent
        window.addEventListener('message', function(event) {
            if (event.data && event.data.source === 'msm-app') {
                const { type, data } = event.data;
                console.log('Received message from MSM:', type, data);
            }
        });
    </script>
</body>
</html>
