<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chord Cubes | Harmonic Oracle</title>
    <meta http-equiv="refresh" content="0;url=http://localhost:8080/">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #7c3aed 0%, #a855f7 50%, #d946ef 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 3rem 2rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .cube-animation {
            width: 80px;
            height: 80px;
            margin: 0 auto 2rem;
            position: relative;
            transform-style: preserve-3d;
            animation: rotate 4s infinite linear;
        }

        .cube-face {
            position: absolute;
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .cube-face:nth-child(1) {
            transform: rotateY(0deg) translateZ(40px);
        }

        .cube-face:nth-child(2) {
            transform: rotateY(90deg) translateZ(40px);
        }

        .cube-face:nth-child(3) {
            transform: rotateY(180deg) translateZ(40px);
        }

        .cube-face:nth-child(4) {
            transform: rotateY(-90deg) translateZ(40px);
        }

        .cube-face:nth-child(5) {
            transform: rotateX(90deg) translateZ(40px);
        }

        .cube-face:nth-child(6) {
            transform: rotateX(-90deg) translateZ(40px);
        }

        @keyframes rotate {
            0% {
                transform: rotateX(0deg) rotateY(0deg);
            }

            100% {
                transform: rotateX(360deg) rotateY(360deg);
            }
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .subtitle {
            font-size: 1.125rem;
            opacity: 0.9;
            margin-bottom: 2rem;
        }

        .btn {
            background: #0066ff;
            color: white;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
            margin: 0.5rem;
        }

        .btn:hover {
            background: #0052cc;
            transform: translateY(-2px);
        }

        .back-link {
            position: absolute;
            top: 2rem;
            left: 2rem;
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <a href="../" class="back-link">← Back to Platform</a>
    <div class="container">
        <div class="cube-animation">
            <div class="cube-face">I</div>
            <div class="cube-face">IV</div>
            <div class="cube-face">V</div>
            <div class="cube-face">vi</div>
            <div class="cube-face">ii</div>
            <div class="cube-face">iii</div>
        </div>
        <div class="loader"></div>
        <h1>🎲 Harmonic Oracle</h1>
        <p class="subtitle">Interactive 3D harmonic visualization with Roman numeral chord analysis.</p>
        <p style="font-size: 0.875rem; opacity: 0.8; margin-bottom: 2rem;">Launching Harmonic Oracle on
            localhost:8080...</p>
        <a href="http://localhost:8080/" class="btn">🎲 Open Harmonic Oracle</a>
        <a href="../" class="btn" style="background: rgba(255,255,255,0.2);">← Back to Platform</a>
    </div>
    <script> setTimeout(() => { window.location.href = 'http://localhost:8080/'; }, 3000); </script>
</body>

</html>
