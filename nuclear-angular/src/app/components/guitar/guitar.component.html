<div class="guitar-container">
	<h3>🎸 Advanced Guitar Component</h3>
	<p><strong>Service Status:</strong> {{ isServiceReady ? '✅ Ready' : '⏳ Loading WebAudioFont...' }}</p>
	<p>MIDI Note: {{ midinote }}</p>
	<p>Delay: {{ delay }}ms</p>

	<div class="button-group">
		<button class="play-button" type="button" (click)="play_note()" [disabled]="!isServiceReady">
			🎵 Play Note
		</button>
		<button class="chord-button" type="button" (click)="play_chord()" [disabled]="!isServiceReady">
			🎶 Play C Major Chord
		</button>
	</div>

	<div class="controls">
		<label>MIDI Note:
			<input type="number" [(ngModel)]="midinote" min="0" max="127">
		</label>
		<label>Delay:
			<input type="number" [(ngModel)]="delay" min="0" max="1000"> ms
		</label>
	</div>
</div>
